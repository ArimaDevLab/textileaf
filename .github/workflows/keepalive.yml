name: Supabase keep-alive
# Free Supabase projects pause after 7 days without activity.
# This makes one tiny read request every day so the relay stays awake.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://fpdyjvhmbjyzyxmiwlaa.supabase.co/rest/v1/usage_events?select=id&limit=1' \
            -H 'apikey: sb_publishable_i_ochJ2NZZ0QHLYmUAdClA_WItxfOZO')
          echo "HTTP $code"
          test "$code" = 200
